[project]
name = "rag-backend"
version = "0.1.0"
description = "Source-grounded finance text RAG and PostgreSQL bond API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6",
    "fastapi>=0.115",
    "langchain-chroma>=0.2",
    "langchain-ollama>=0.3",
    "langsmith>=0.3",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false
